name: Build and publish a Docker image

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      mautic_version:
        description: 'Mautic version (has to be a valid version from `mautic/recommended-project` https://packagist.org/packages/mautic/recommended-project)'
        required: true
      overwrite_latest_major:
        type: boolean
        description: "Overwrite latest major tag (e.g.`7`). This should only be checked if you're releasing the latest release."
      overwrite_latest_minor:
        type: boolean
        description: "Overwrite latest minor tag (e.g.`7.0`). This should only be checked if you're releasing the latest release within the minor release."
      tag_as_latest:
        type: boolean
        description: "Tag this release as latest"
      publish:
        type: boolean
        description: Publish this build as a new package.

concurrency:
  group: push-to-registry-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  push_to_registry:
    name: Build image
    runs-on: ubuntu-latest
    env:
      MAUTIC_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.mautic_version || (github.ref == 'refs/heads/main' && '7.x-dev') || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        image_type: [apache,fpm]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Docker meta
        uses: docker/metadata-action@v5
        id: meta
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/librecodecoop/mautic
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}},value=${{ env.MAUTIC_VERSION }},enable=${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.MAUTIC_VERSION }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.overwrite_latest_minor }}
            type=semver,pattern={{major}},value=${{ env.MAUTIC_VERSION }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.overwrite_latest_major }}
            type=raw,value=7.x-dev,enable=${{ github.ref == 'refs/heads/main' }},suffix=-${{ matrix.image_type }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_as_latest && matrix.image_type == 'apache' }},suffix=
          flavor: |
            latest=false
            prefix=
            suffix=-${{ matrix.image_type }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ matrix.image_type }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ matrix.image_type }}-buildx-
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.publish }}
          context: .docker
          platforms: linux/amd64,linux/arm64
          file: .docker/Dockerfile.${{ matrix.image_type }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            MAUTIC_VERSION=${{ env.MAUTIC_VERSION }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
