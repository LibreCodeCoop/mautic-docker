x-mautic-volumes: &mautic-volumes
  - ./volumes/mautic:/var/www/html:z
  - ./volumes/cron:/opt/mautic/cron:z

x-mautic-environments: &mautic-environments
  MAUTIC_VERSION: ${MAUTIC_VERSION:-7.x-dev}
  TZ: ${TZ:-CET}
  HOST_UID: ${HOST_UID:-1000}
  HOST_GID: ${HOST_GID:-1000}
  MAUTIC_DB_HOST: ${MAUTIC_DB_HOST:-mysql}
  MAUTIC_DB_PORT: ${MAUTIC_DB_PORT:-3306}
  MAUTIC_DB_USER: ${MAUTIC_DB_USER:-mautic}
  MAUTIC_DB_PASSWORD: ${MAUTIC_DB_PASSWORD:-mautic}
  MAUTIC_DB_NAME: ${MAUTIC_DB_NAME:-mautic}
  MAUTIC_DB_DATABASE: ${MAUTIC_DB_DATABASE:-mautic}
  MAUTIC_DB_TABLE_PREFIX: ${MAUTIC_DB_TABLE_PREFIX:-}
  MAUTIC_DB_BACKUP_TABLES: ${MAUTIC_DB_BACKUP_TABLES:-true}
  MAUTIC_DB_BACKUP_PREFIX: ${MAUTIC_DB_BACKUP_PREFIX:-bak_}
  MAUTIC_AUTO_INSTALL: ${MAUTIC_AUTO_INSTALL:-false}
  MAUTIC_FORCE_INSTALL: ${MAUTIC_FORCE_INSTALL:-false}
  MAUTIC_SITE_URL: ${MAUTIC_SITE_URL:-http://localhost}
  MAUTIC_ADMIN_FIRSTNAME: ${MAUTIC_ADMIN_FIRSTNAME:-Admin}
  MAUTIC_ADMIN_LASTNAME: ${MAUTIC_ADMIN_LASTNAME:-Mautic}
  MAUTIC_ADMIN_USERNAME: ${MAUTIC_ADMIN_USERNAME:-admin}
  MAUTIC_ADMIN_EMAIL: ${MAUTIC_ADMIN_EMAIL:-admin@example.com}
  MAUTIC_ADMIN_PASSWORD: ${MAUTIC_ADMIN_PASSWORD:-ChangeMe123!}
  MAUTIC_RUN_CRON_JOBS: ${MAUTIC_RUN_CRON_JOBS:-true}
  XDEBUG_CONFIG: ${XDEBUG_CONFIG:-}
  MAUTIC_MESSENGER_DSN_EMAIL: ${MAUTIC_MESSENGER_DSN_EMAIL:-doctrine://default}
  MAUTIC_MESSENGER_DSN_HIT: ${MAUTIC_MESSENGER_DSN_HIT:-doctrine://default}

services:
  mautic_web:
    image: ghcr.io/librecodecoop/mautic:${MAUTIC_VERSION:-7.x-dev}-${IMAGE_TYPE:-apache}
    # build:
    #   context: .docker/
    #   dockerfile: Dockerfile.${IMAGE_TYPE:-apache}
    restart: unless-stopped
    volumes: *mautic-volumes
    environment:
      <<: *mautic-environments
      DOCKER_MAUTIC_LOAD_TEST_DATA: ${DOCKER_MAUTIC_LOAD_TEST_DATA:-false}
      DOCKER_MAUTIC_RUN_MIGRATIONS: ${DOCKER_MAUTIC_RUN_MIGRATIONS:-false}
    healthcheck:
      test: curl http://localhost
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 100

  mautic_cron:
    image: ghcr.io/librecodecoop/mautic:${MAUTIC_VERSION:-7.x-dev}-${IMAGE_TYPE:-apache}
    # build:
    #   context: .docker/
    #   dockerfile: Dockerfile.${IMAGE_TYPE:-apache}
    restart: unless-stopped
    volumes: *mautic-volumes
    environment:
      <<: *mautic-environments
      DOCKER_MAUTIC_ROLE: mautic_cron
    depends_on:
      mautic_web:
        condition: service_healthy

  mautic_worker:
    image: ghcr.io/librecodecoop/mautic:${MAUTIC_VERSION:-7.x-dev}-${IMAGE_TYPE:-apache}
    # build:
    #   context: .docker/
    #   dockerfile: Dockerfile.${IMAGE_TYPE:-apache}
    restart: unless-stopped
    volumes: *mautic-volumes
    environment:
      <<: *mautic-environments
      DOCKER_MAUTIC_ROLE: mautic_worker
    depends_on:
      mautic_web:
        condition: service_healthy
